<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USDC Bridge!</title>
  <script src="https://cdn.ethers.io/lib/ethers-6.13.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #1a0a3c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── SKY GRADIENT ── */
    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, #0d0030 0%, #3b0080 40%, #ff6ec7 75%, #ffb347 100%);
      z-index: 0;
    }

    /* ── STARS ── */
    .stars {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle 2s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.2; transform: scale(0.5); }
    }

    /* ── FLOATING COINS ── */
    .coins-layer { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .coin {
      position: absolute;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Boogaloo', cursive;
      font-weight: 900;
      color: #7a4000;
      animation: coinFloat linear infinite;
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.25), 0 0 20px rgba(255,220,50,0.6);
    }
    .coin::after {
      content: '$';
      font-size: 0.55em;
    }
    @keyframes coinFloat {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
    }

    /* ── BRIDGE SVG ── */
    .bridge-wrap {
      position: relative; z-index: 10;
      width: min(540px, 95vw);
      display: flex; flex-direction: column; align-items: center;
    }

    .bridge-svg {
      width: 100%;
      height: 110px;
      display: block;
      margin-bottom: -6px;
      filter: drop-shadow(0 -6px 18px rgba(255,100,200,0.5));
    }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 0 0 36px 36px;
      padding: 32px 32px 36px;
      width: 100%;
      box-shadow:
        0 12px 0 #c9006b,
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 0 0 5px #FF3CAC;
      position: relative;
      z-index: 10;
    }

    /* ── TITLE ── */
    .title {
      font-family: 'Boogaloo', cursive;
      font-size: 3rem;
      text-align: center;
      line-height: 1;
      margin-bottom: 4px;
      -webkit-text-stroke: 3px #2D0060;
      paint-order: stroke fill;
      background: linear-gradient(135deg, #FF3CAC, #784BA0, #2B86C5, #00F5A0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,0.15));
    }

    .subtitle {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 900;
      color: #784BA0;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    /* ── CHAIN ROW ── */
    .chain-row {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 24px;
    }
    .chain-badge {
      font-family: 'Boogaloo', cursive;
      font-size: 1.3rem;
      padding: 12px 24px;
      border-radius: 999px;
      color: white;
      -webkit-text-stroke: 1px rgba(0,0,0,0.2);
      box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 0 24px rgba(100,150,255,0.4);
    }
    .chain-badge.arb { background: linear-gradient(135deg, #28A0F0, #0052B0); }
    .chain-badge.base { background: linear-gradient(135deg, #00C2FF, #0052B0); }

    .arrow-anim {
      font-size: 2.2rem;
      animation: arrowPop 0.6s ease-in-out infinite alternate;
      filter: drop-shadow(0 2px 6px rgba(255,200,0,0.8));
    }
    @keyframes arrowPop {
      from { transform: translateX(-4px) scale(1);   }
      to   { transform: translateX(4px)  scale(1.2); }
    }

    /* ── CONNECT BUTTON ── */
    .connect-btn {
      width: 100%;
      padding: 20px;
      font-family: 'Boogaloo', cursive;
      font-size: 1.9rem;
      letter-spacing: 1px;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      color: #2D0060;
      background: linear-gradient(135deg, #FFE000, #FF9500);
      box-shadow: 0 8px 0 #b85f00, 0 12px 30px rgba(255,180,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-text-stroke: 1px rgba(0,0,0,0.1);
    }
    .connect-btn:hover  { transform: translateY(-3px); box-shadow: 0 11px 0 #b85f00, 0 16px 40px rgba(255,180,0,0.5); }
    .connect-btn:active { transform: translateY(6px);  box-shadow: 0 2px 0 #b85f00; }

    /* ── WALLET INFO ── */
    .wallet-info {
      text-align: center; font-weight: 900; font-size: 0.9rem;
      color: #784BA0; margin-bottom: 18px;
      background: #F3E8FF; border-radius: 12px; padding: 8px 14px;
    }

    /* ── INPUT ── */
    .input-label {
      font-family: 'Boogaloo', cursive;
      font-size: 1.3rem; color: #2D0060; margin-bottom: 8px; display: block;
    }
    .amount-wrapper { position: relative; margin-bottom: 14px; }
    .amount-input {
      width: 100%;
      padding: 18px 100px 18px 22px;
      font-family: 'Boogaloo', cursive;
      font-size: 2rem;
      border: 5px solid #784BA0;
      border-radius: 20px;
      outline: none;
      color: #2D0060;
      background: #F3E8FF;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .amount-input:focus {
      border-color: #FF3CAC;
      box-shadow: 0 0 0 4px rgba(255,60,172,0.25);
    }
    .amount-input::placeholder { color: #C4A8E0; }
    .token-tag {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      font-family: 'Boogaloo', cursive; font-size: 1.3rem;
      background: linear-gradient(135deg, #FFE000, #FF9500);
      color: #2D0060; padding: 8px 16px; border-radius: 14px;
      box-shadow: 0 4px 0 #b85f00;
    }

    /* ── QUICK BTNS ── */
    .quick-amounts { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .quick-btn {
      flex: 1; min-width: 54px;
      padding: 12px 6px;
      font-family: 'Boogaloo', cursive; font-size: 1.1rem;
      border: 4px solid #784BA0; border-radius: 16px;
      background: white; color: #784BA0; cursor: pointer;
      box-shadow: 0 5px 0 #4a1a80;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .quick-btn:hover  { background: #784BA0; color: white; transform: translateY(-2px); box-shadow: 0 7px 0 #4a1a80; }
    .quick-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #4a1a80; }

    /* ── QUOTE BOX ── */
    .quote-box {
      background: linear-gradient(135deg, #e8f4ff, #f3e8ff);
      border: 4px dashed #2B86C5;
      border-radius: 18px; padding: 14px 18px; margin-bottom: 20px;
      display: none;
    }
    .quote-box.visible { display: block; animation: popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
    .quote-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0; font-size: 1rem; font-weight: 900; color: #2D0060;
    }
    .quote-row .lbl { opacity: 0.55; }
    .quote-row .val { font-family: 'Boogaloo', cursive; font-size: 1.15rem; color: #784BA0; }
    .quote-row .val.green { color: #00A86B; }

    /* ── BRIDGE BUTTON ── */
    .bridge-btn {
      width: 100%;
      padding: 22px;
      font-family: 'Boogaloo', cursive;
      font-size: 2rem; letter-spacing: 1px;
      border: none; border-radius: 22px; cursor: pointer;
      color: white;
      -webkit-text-stroke: 1.5px rgba(0,0,0,0.15);
      background: linear-gradient(135deg, #FF3CAC, #784BA0, #2B86C5);
      background-size: 300% 300%;
      animation: btnShift 3s ease infinite;
      box-shadow: 0 8px 0 #5a0070, 0 14px 40px rgba(255,60,172,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .bridge-btn:hover:not(:disabled)  { transform: translateY(-4px); box-shadow: 0 12px 0 #5a0070, 0 20px 50px rgba(255,60,172,0.5); }
    .bridge-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #5a0070; }
    .bridge-btn:disabled { opacity: 0.55; cursor: not-allowed; animation: none; background-position: 0% 50%; }
    @keyframes btnShift {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }

    /* ── STATUS ── */
    .status-area { margin-top: 18px; text-align: center; display: none; }
    .status-area.visible { display: block; }
    .status-msg { font-family: 'Boogaloo', cursive; font-size: 1.3rem; color: #2D0060; margin-bottom: 8px; }
    .progress-bar { width: 100%; height: 18px; border-radius: 10px; background: #E8D5FF; overflow: hidden; margin-bottom: 8px; border: 3px solid #784BA0; }
    .progress-fill {
      height: 100%; border-radius: 8px;
      background: linear-gradient(90deg, #00F5A0, #2B86C5, #FF3CAC, #FFE000);
      background-size: 300% 100%;
      animation: progressAnim 1.2s linear infinite;
      transition: width 0.6s;
    }
    @keyframes progressAnim {
      0%   { background-position: 100% 0; }
      100% { background-position:   0% 0; }
    }
    .tx-link { font-size: 0.9rem; color: #784BA0; font-weight: 900; text-decoration: none; }
    .tx-link:hover { text-decoration: underline; }

    /* ── SUCCESS ── */
    .success-banner {
      display: none; text-align: center; padding: 18px;
      background: linear-gradient(135deg, #00F5A0, #2B86C5);
      border-radius: 20px; margin-top: 14px;
      color: white; font-family: 'Boogaloo', cursive; font-size: 1.7rem;
      -webkit-text-stroke: 1px rgba(0,0,0,0.1);
      box-shadow: 0 6px 0 #007a50, 0 10px 30px rgba(0,245,160,0.4);
    }
    .success-banner.visible { display: block; animation: popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }

    /* ── ERROR ── */
    .error-msg {
      color: #FF3333; font-weight: 900; font-size: 1rem;
      text-align: center; margin-top: 10px; display: none;
      background: #FFE8E8; border-radius: 12px; padding: 10px 14px;
      border: 3px solid #FF3333;
    }
    .error-msg.visible { display: block; animation: popIn 0.3s ease; }

    @keyframes popIn {
      0%   { transform: scale(0.6) rotate(-3deg); opacity: 0; }
      100% { transform: scale(1)   rotate(0deg);  opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="sky"></div>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Floating coins -->
  <div class="coins-layer" id="coins"></div>

  <!-- Bridge + Card -->
  <div class="bridge-wrap">

    <!-- SVG Suspension Bridge -->
    <svg class="bridge-svg" viewBox="0 0 540 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Road deck -->
      <rect x="0" y="88" width="540" height="14" rx="4" fill="#FF9500" stroke="#b85f00" stroke-width="3"/>
      <!-- Road stripes -->
      <rect x="60"  y="93" width="40" height="5" rx="2" fill="#FFE000"/>
      <rect x="155" y="93" width="40" height="5" rx="2" fill="#FFE000"/>
      <rect x="250" y="93" width="40" height="5" rx="2" fill="#FFE000"/>
      <rect x="345" y="93" width="40" height="5" rx="2" fill="#FFE000"/>
      <rect x="440" y="93" width="40" height="5" rx="2" fill="#FFE000"/>

      <!-- Left tower -->
      <rect x="108" y="14" width="20" height="82" rx="5" fill="#FF3CAC" stroke="#9b006b" stroke-width="3"/>
      <rect x="96"  y="14" width="44" height="14" rx="6" fill="#FF3CAC" stroke="#9b006b" stroke-width="3"/>
      <!-- Tower top ball -->
      <circle cx="118" cy="10" r="9" fill="#FFE000" stroke="#b85f00" stroke-width="3"/>

      <!-- Right tower -->
      <rect x="412" y="14" width="20" height="82" rx="5" fill="#FF3CAC" stroke="#9b006b" stroke-width="3"/>
      <rect x="400" y="14" width="44" height="14" rx="6" fill="#FF3CAC" stroke="#9b006b" stroke-width="3"/>
      <!-- Tower top ball -->
      <circle cx="422" cy="10" r="9" fill="#FFE000" stroke="#b85f00" stroke-width="3"/>

      <!-- Main cables (catenary curves) -->
      <path d="M 118 18 Q 270 55 422 18" stroke="#784BA0" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 118 18 Q 270 55 422 18" stroke="#C471F5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="8 6"/>

      <!-- Vertical suspenders -->
      <line x1="160" y1="34.5" x2="160" y2="88" stroke="#784BA0" stroke-width="3" stroke-linecap="round"/>
      <line x1="200" y1="43"   x2="200" y2="88" stroke="#784BA0" stroke-width="3" stroke-linecap="round"/>
      <line x1="240" y1="48.5" x2="240" y2="88" stroke="#784BA0" stroke-width="3" stroke-linecap="round"/>
      <line x1="270" y1="50"   x2="270" y2="88" stroke="#784BA0" stroke-width="3" stroke-linecap="round"/>
      <line x1="300" y1="48.5" x2="300" y2="88" stroke="#784BA0" stroke-width="3" stroke-linecap="round"/>
      <line x1="340" y1="43"   x2="340" y2="88" stroke="#784BA0" stroke-width="3" stroke-linecap="round"/>
      <line x1="380" y1="34.5" x2="380" y2="88" stroke="#784BA0" stroke-width="3" stroke-linecap="round"/>

      <!-- Approach roads -->
      <rect x="0"   y="88" width="108" height="14" rx="0" fill="#FF9500" stroke="#b85f00" stroke-width="2"/>
      <rect x="432" y="88" width="108" height="14" rx="0" fill="#FF9500" stroke="#b85f00" stroke-width="2"/>

      <!-- Cute chain labels on towers -->
      <rect x="86" y="52" width="64" height="22" rx="8" fill="#FFE000" stroke="#b85f00" stroke-width="2"/>
      <text x="118" y="67" text-anchor="middle" font-family="Boogaloo,cursive" font-size="12" fill="#2D0060">ARB</text>

      <rect x="390" y="52" width="64" height="22" rx="8" fill="#00C2FF" stroke="#007bb5" stroke-width="2"/>
      <text x="422" y="67" text-anchor="middle" font-family="Boogaloo,cursive" font-size="12" fill="white">BASE</text>
    </svg>

    <!-- Card -->
    <div class="card">
      <div class="title">USDC BRIDGE!</div>
      <div class="subtitle">🚀 Zoom your coins from Arbitrum to Base! 🚀</div>

      <div class="chain-row">
        <div class="chain-badge arb">⚡ Arbitrum</div>
        <span class="arrow-anim">➡️</span>
        <div class="chain-badge base">🔵 Base</div>
      </div>

      <!-- Wallet connect -->
      <div id="walletSection">
        <button class="connect-btn" onclick="connectWallet()">
          🦊 Connect Wallet!
        </button>
      </div>

      <!-- Bridge form -->
      <div id="bridgeForm" style="display:none;">
        <div class="wallet-info" id="walletAddr"></div>

        <label class="input-label">💰 How much USDC to send?</label>
        <div class="amount-wrapper">
          <input type="number" class="amount-input" id="amountInput"
            placeholder="0.00" min="0" step="any" oninput="onAmountChange()"/>
          <span class="token-tag">USDC</span>
        </div>

        <div class="quick-amounts">
          <button class="quick-btn" onclick="setAmount('1')">$1</button>
          <button class="quick-btn" onclick="setAmount('5')">$5</button>
          <button class="quick-btn" onclick="setAmount('10')">$10</button>
          <button class="quick-btn" onclick="setAmount('25')">$25</button>
          <button class="quick-btn" onclick="setAmount('50')">$50</button>
        </div>

        <div class="quote-box" id="quoteBox">
          <div class="quote-row">
            <span class="lbl">You receive</span>
            <span class="val green" id="quoteOutput">--</span>
          </div>
          <div class="quote-row">
            <span class="lbl">Bridge fee</span>
            <span class="val" id="quoteFee">--</span>
          </div>
          <div class="quote-row">
            <span class="lbl">Speed</span>
            <span class="val" id="quoteTime">--</span>
          </div>
        </div>

        <button class="bridge-btn" id="bridgeBtn" onclick="doBridge()" disabled>
          🌉 Get Quote First!
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <div class="status-area" id="statusArea">
          <div class="status-msg" id="statusMsg">Sending…</div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
          <a class="tx-link" id="txLink" href="#" target="_blank" style="display:none;"></a>
        </div>

        <div class="success-banner" id="successBanner">
          🎉 WOOHOO! Your USDC landed on Base! 🎉
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── STARS ──
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 3 + 1;
      s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*70}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s`;
      starsEl.appendChild(s);
    }

    // ── COINS ──
    const coinsEl = document.getElementById('coins');
    const coinColors = [
      ['#FFD700','#FFA500'],['#C0C0C0','#888'],['#50C8FF','#0080C0'],
      ['#FF6EC7','#C00080'],['#00F5A0','#007A50'],['#FF9500','#B85F00'],
    ];
    function spawnCoin() {
      const c = document.createElement('div');
      c.className = 'coin';
      const size = 36 + Math.random() * 44;
      const [bg1, bg2] = coinColors[Math.floor(Math.random() * coinColors.length)];
      const dur = 6 + Math.random() * 10;
      const delay = Math.random() * 4;
      c.style.cssText = `
        width:${size}px;height:${size}px;
        left:${Math.random()*100}%;
        background:radial-gradient(circle at 35% 35%, ${bg1}, ${bg2});
        font-size:${size*0.42}px;
        animation-duration:${dur}s;
        animation-delay:${delay}s;
      `;
      coinsEl.appendChild(c);
      setTimeout(() => c.remove(), (dur + delay) * 1000 + 500);
    }
    for (let i = 0; i < 18; i++) spawnCoin();
    setInterval(spawnCoin, 900);

    // ── BRIDGE LOGIC ──
    const ACROSS_API      = 'https://app.across.to/api';
    const ARBITRUM_CHAIN  = 42161;
    const BASE_CHAIN      = 8453;
    const USDC_ARB        = '0xaf88d065e77c8cC2239327C5EDb3A432268e5831';
    const USDC_BASE       = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
    const ARB_HEX         = '0x' + ARBITRUM_CHAIN.toString(16);

    let provider, signer, depositor, currentQuote, quoteTimer;

    const $ws    = document.getElementById('walletSection');
    const $bf    = document.getElementById('bridgeForm');
    const $wa    = document.getElementById('walletAddr');
    const $ai    = document.getElementById('amountInput');
    const $qb    = document.getElementById('quoteBox');
    const $qo    = document.getElementById('quoteOutput');
    const $qf    = document.getElementById('quoteFee');
    const $qt    = document.getElementById('quoteTime');
    const $bb    = document.getElementById('bridgeBtn');
    const $em    = document.getElementById('errorMsg');
    const $sa    = document.getElementById('statusArea');
    const $sm    = document.getElementById('statusMsg');
    const $pf    = document.getElementById('progressFill');
    const $tl    = document.getElementById('txLink');
    const $sb    = document.getElementById('successBanner');

    function showError(msg) {
      $em.textContent = msg; $em.classList.add('visible');
      setTimeout(() => $em.classList.remove('visible'), 6000);
    }
    function short(a) { return a.slice(0,6)+'…'+a.slice(-4); }
    function fmtUSDC(wei) {
      const n = Number(wei)/1e6;
      return (n < 1 ? n.toFixed(4) : n.toFixed(2)) + ' USDC';
    }

    async function connectWallet() {
      if (!window.ethereum) { showError('No wallet found! Install MetaMask.'); return; }
      try {
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send('eth_requestAccounts', []);
        signer   = await provider.getSigner();
        depositor = await signer.getAddress();
        try {
          await window.ethereum.request({ method:'wallet_switchEthereumChain', params:[{chainId:ARB_HEX}] });
        } catch(e) {
          if (e.code === 4902) await window.ethereum.request({ method:'wallet_addEthereumChain', params:[{
            chainId: ARB_HEX, chainName:'Arbitrum One',
            rpcUrls:['https://arb1.arbitrum.io/rpc'],
            nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18},
            blockExplorerUrls:['https://arbiscan.io'],
          }]});
          else throw e;
        }
        provider  = new ethers.BrowserProvider(window.ethereum);
        signer    = await provider.getSigner();
        $ws.style.display = 'none';
        $bf.style.display = 'block';
        $wa.textContent   = '🦊 ' + short(depositor) + '  •  Arbitrum';
      } catch(e) { showError(e.message || 'Wallet connect failed'); }
    }

    function setAmount(v) { $ai.value = v; onAmountChange(); }

    function onAmountChange() {
      clearTimeout(quoteTimer);
      currentQuote = null;
      $bb.disabled = true;
      $bb.textContent = '🌉 Get Quote First!';
      $qb.classList.remove('visible');
      const v = parseFloat($ai.value);
      if (!v || v <= 0) return;
      quoteTimer = setTimeout(() => fetchQuote(v), 600);
    }

    async function fetchQuote(amount) {
      if (!depositor) return;
      $bb.textContent = '⏳ Loading quote…';
      $bb.disabled = true;
      try {
        const amtWei = BigInt(Math.round(amount * 1e6)).toString();
        const p = new URLSearchParams({
          tradeType:'exactInput', amount:amtWei,
          inputToken:USDC_ARB, outputToken:USDC_BASE,
          originChainId:ARBITRUM_CHAIN, destinationChainId:BASE_CHAIN,
          depositor, slippage:'auto',
        });
        const res = await fetch(`${ACROSS_API}/swap/approval?${p}`);
        if (!res.ok) throw new Error(await res.text());
        currentQuote = await res.json();
        const out = Number(currentQuote.expectedOutputAmount)/1e6;
        const fee = amount - out;
        $qo.textContent = fmtUSDC(currentQuote.expectedOutputAmount);
        $qf.textContent = fee > 0 ? '~'+fee.toFixed(4)+' USDC' : '< 0.0001 USDC';
        $qt.textContent = '~'+(currentQuote.expectedFillTime||2)+'s ⚡';
        $qb.classList.add('visible');
        $bb.textContent = '🚀 Bridge '+amount+' USDC!';
        $bb.disabled = false;
      } catch(e) {
        showError('Quote failed: '+(e.message||e));
        $bb.textContent = '🌉 Get Quote First!';
      }
    }

    async function doBridge() {
      if (!currentQuote || !signer) return;
      $bb.disabled = true; $bb.textContent = '🌉 Bridging…';
      $sa.classList.add('visible'); $sb.classList.remove('visible');
      $tl.style.display = 'none'; $pf.style.width = '10%';
      try {
        if (currentQuote.approvalTxns?.length) {
          $sm.textContent = '✅ Approving USDC…'; $pf.style.width = '15%';
          for (const a of currentQuote.approvalTxns) {
            const tx = await signer.sendTransaction({to:a.to, data:a.data});
            await tx.wait();
          }
          $pf.style.width = '30%';
        }
        $sm.textContent = '📤 Sending to bridge…'; $pf.style.width = '40%';
        const swapTx = await signer.sendTransaction({
          to: currentQuote.swapTx.to,
          data: currentQuote.swapTx.data,
          gasLimit: currentQuote.swapTx.gas,
        });
        $sm.textContent = '⏳ Waiting for confirmation…'; $pf.style.width = '50%';
        $tl.href = 'https://arbiscan.io/tx/'+swapTx.hash;
        $tl.textContent = '🔗 View on Arbiscan: '+short(swapTx.hash);
        $tl.style.display = 'block';
        const receipt = await swapTx.wait();
        $pf.style.width = '65%';
        $sm.textContent = '🎯 Confirmed! Waiting for Base fill…';
        await pollStatus(receipt.hash);
      } catch(e) {
        showError(e.reason || e.message || 'Transaction failed');
        $sm.textContent = '❌ Failed!'; $pf.style.width = '0%';
        $bb.disabled = false; $bb.textContent = '🔄 Try Again!';
      }
    }

    async function pollStatus(txHash) {
      const url = `${ACROSS_API}/deposit/status?depositTxnRef=${txHash}`;
      for (let i = 0; i < 60; i++) {
        try {
          const r = await fetch(url);
          if (r.ok) {
            const d = await r.json();
            $pf.style.width = Math.min(65+i*2, 95)+'%';
            if (d.status === 'filled') {
              $pf.style.width = '100%';
              $sm.textContent = '🎉 Filled!';
              $sb.classList.add('visible');
              $bb.textContent = '🚀 Bridge More!';
              $bb.disabled = false;
              currentQuote = null;
              return;
            }
          }
        } catch(_) {}
        await new Promise(r => setTimeout(r, 10000));
      }
      $sm.textContent = 'Still waiting… check Across explorer.';
      $bb.textContent = '🚀 Bridge More!'; $bb.disabled = false;
    }
  </script>
</body>
